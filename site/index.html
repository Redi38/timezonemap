<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>World Time Globe</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header><h1>World Time Globe</h1><span id="utc"></span></header>
<div id="wrap"><canvas id="g"></canvas><div id="tip"></div>
<div id="sb"><input id="q" type="search" placeholder="Search a city or country" autocomplete="off" spellcheck="false" aria-label="Search a city or country" role="combobox" aria-expanded="false" aria-controls="res"><ul id="res" role="listbox"></ul><div id="found" aria-live="polite"></div></div></div>
<div id="bar"><button id="brot">Pause rotation</button><button id="bfmt">Use 12-hour</button><button id="bzi" aria-label="Zoom in">+</button><button id="bzo" aria-label="Zoom out">−</button></div>
<div id="leg"><div id="lb"></div><div id="lt"><span>UTC−12</span><span>−6</span><span>0</span><span>+6</span><span>+12</span></div></div>
<noscript>This page needs JavaScript to draw the globe.</noscript>
<script src="d3.min.js"></script>
<script src="countries.js"></script>
<script type="module" src="js/main.js"></script>
</body></html>
