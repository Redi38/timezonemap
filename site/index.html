<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Time Globe</title>
<style>
:root{--bg:#eef2f7;--fg:#13202f;--mut:#566679;--chip:#ffffff;--line:#c9d3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d19;--fg:#e8eef7;--mut:#8fa1b8;--chip:#111b2e;--line:#243350}}
:root[data-theme="dark"]{--bg:#070d19;--fg:#e8eef7;--mut:#8fa1b8;--chip:#111b2e;--line:#243350}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 18px 0;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
#utc{color:var(--mut);font-variant-numeric:tabular-nums}
#wrap{position:relative;flex:1;min-height:0}
canvas{display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#tip{position:absolute;pointer-events:none;display:none;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;max-width:290px;box-shadow:0 6px 20px #0004}
#tip b{font-size:14px}#tip .t{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}#tip .m{color:var(--mut);font-size:12px}
#tip .d{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}#tip .d b{font-size:12px}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 14px 8px}
button{background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #4da3ff;outline-offset:2px}
#leg{width:min(560px,90%);margin:0 auto 12px}
#lb{height:8px;border-radius:4px}
#lt{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:3px}
</style></head><body>

function tipUpdate(){if(!hov||!mouse||drag){tip.style.display='none';tkey='';return}
 const key=hov.properties.n+now.getSeconds();if(key!==tkey){tkey=key;
  if(!hov.tz)tip.innerHTML=`<b>${hov.properties.n}</b><div class="m">No official local time</div>`;
  else{const d=new Intl.DateTimeFormat('en-GB',{timeZone:hov.tz,weekday:'short',day:'numeric',month:'short'}).format(now);
   const t=new Intl.DateTimeFormat('en-GB',{timeZone:hov.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:h12}).format(now);
   tip.innerHTML=`<b>${hov.properties.n}</b><div class="t">${t}</div><div class="m">${d} · ${fo(hov.off)}<br>${hov.tz.replace(/_/g,' ')}${hov.z.length>1?'<br>Several time zones — showing the one nearest the country’s centre':''}</div>${dstHtml(hov)}`}}
 tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(4,Math.min(W-w-4,mouse[0]+14))+'px';tip.style.top=Math.max(4,Math.min(H-h-4,mouse[1]+14))+'px'}
function pickAt(x,y){if(Math.hypot(x-W/2,y-H/2)>k)return null;const ll=proj.invert([x,y]);return ll?F.find(f=>d3.geoContains(f,ll))||null:null}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();mouse=[e.clientX-r.left,e.clientY-r.top];drag={x:e.clientX,y:e.clientY,m:0}});

 else hov=pickAt(mouse[0],mouse[1])});

cv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015))},{passive:false});

const lb=document.getElementById('lb'),st=[];for(let o=-12;o<=14;o++)st.push(`hsl(${(o*15+360)%360},55%,48%)`);lb.style.background=`linear-gradient(90deg,${st.join(',')})`;
