server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # detail.json (the zoomed-in map) is ~5 MB of JSON and shrinks to about a third when compressed
    gzip on;
    gzip_min_length 1024;
    gzip_types image/svg+xml application/json text/html text/css text/javascript application/javascript;
}
