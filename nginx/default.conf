server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # detail-1.json and detail-2.json (the zoomed-in map) are 1.2 MB and 2.2 MB of JSON; they shrink to about a third when
    # compressed.  nginx always compresses text/html, so it is not listed.  Level 1 (the default) is about 20% bigger than 6.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;            # tell caches that the answer depends on Accept-Encoding
    gzip_min_length 1024;
    gzip_types image/svg+xml application/json text/css text/javascript application/javascript;

    # The data files carry a hash of their content in the name (cities.<hash>.json, detail-1.<hash>.json; tools/data_files.py
    # writes them and js/data-files.js lists the current names).  A name never changes meaning, so browsers and CDNs may
    # keep it for a year without asking again.  Keep the 10 in step with HASH_LEN in tools/data_files.py.
    location ~ ^/(cities|detail-[0-9]+)\.[0-9a-f]{10}\.json$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (the page, scripts, styles, and js/data-files.js with the current data file names) is revalidated on
    # each visit.  That costs a 304 when nothing changed, and it means a new deploy is picked up at once; without it a
    # browser may reuse an old data-files.js for hours and ask for data files that no longer exist.
    location / {
        add_header Cache-Control "no-cache";
    }
}
